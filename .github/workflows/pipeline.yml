name: Pipeline

# Builds every platform's library, packages the addon and loads the package
# in each supported Godot, so CI and a release run the same path. A release
# passes its tag and the package is attached to it once everything passed.
# Jobs inherit the caller's token permissions; publishing needs contents: write.
on:
  workflow_call:
    inputs:
      profile:
        description: Cargo profile of the shipped libraries (release or debug).
        type: string
        default: release
      tag:
        description: Release tag to attach the package to; empty skips publishing.
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          profile: debug
      # Formatting is applied as files are written and settled here, before merge.
      - run: bundle exec rake rubocop
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: bundle exec rake beni:build
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: pipx install "gdtoolkit==4.*"
      - run: gdformat --check godot
      - run: gdlint godot

  # Needs neither Ruby nor Rust, so it stands apart from the build setup.
  spec:
    name: Specification
    runs-on: ubuntu-24.04
    env:
      # Pinned by hand: nothing watches a release asset fetched over curl.
      # The digest is pinned alongside the tag because an asset can be replaced.
      SUMI_VERSION: 0.1.0-preview9
      SUMI_SHA256: b2a8eb702c281527b87733491de71c129340c6a1dd63ea6873adf6be6467e200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install sumi
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sumi.tar.gz" \
            "https://github.com/elct9620/sumitsubo/releases/download/v$SUMI_VERSION/sumi-$SUMI_VERSION-linux-x86_64.tar.gz"
          echo "$SUMI_SHA256  $RUNNER_TEMP/sumi.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/sumi.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: sumi verify
      - run: sumi fmt --check

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos, os: macos-15 }
          - { platform: linux-x86_64, os: ubuntu-24.04 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: windows-x86_64, os: windows-2025, msvc: x64 }
          - { platform: windows-arm64, os: windows-11-arm, msvc: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          profile: ${{ inputs.profile }}
      - name: Build
        if: runner.os != 'Windows'
        env:
          PROFILE: ${{ inputs.profile }}
        run: bundle exec rake extension:dist
      # mruby picks its visualcpp toolchain from the environment vcvars sets,
      # and beni-sys compiles against the same one, so the build runs inside it.
      - name: Build (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          PROFILE: ${{ inputs.profile }}
          MSVC_ARCH: ${{ matrix.msvc }}
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" %MSVC_ARCH%
          bundle exec rake extension:dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.platform }}
          path: godot/addons/godot_mruby/bin/
          if-no-files-found: error

  package:
    name: Package
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          target-cache: "false"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: godot/addons/godot_mruby/bin
      - run: bundle exec rake addon:package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: godot-mruby
          path: pkg/godot-mruby.zip
          if-no-files-found: error

  integration:
    name: Integration (${{ matrix.os }}, Godot ${{ matrix.godot }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm]
        # The floor compatibility_minimum claims, and the latest minor; each
        # minor is tested at the release pinned for it.
        godot: ["4.6", "4.7"]
        include:
          - godot: "4.6"
            release: "4.6"
          - godot: "4.7"
            release: "4.7.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ matrix.release }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: godot-mruby
          path: pkg
      - run: bundle exec rake addon:verify

  publish:
    name: Publish
    needs: [check, spec, integration]
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: godot-mruby
          path: pkg
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" pkg/godot-mruby.zip --clobber --repo "$GITHUB_REPOSITORY"
