AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  # The rake files are thin DSL glue; the logic they call lives in
  # tasks/support, which is the Ruby this project holds to a style.
  Include:
    - "tasks/support/**/*.rb"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
