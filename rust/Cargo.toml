[package]
name = "godot-mruby"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# experimental-threads: Godot calls a script language, its scripts and their
# loader from threads other than the main one (the editor's file scan, loading
# threads, any thread printing an error), and gdext panics on those calls
# without it (godot-rust/gdext#597).
# Its blocking bind can still fail: a mutable bind does not wait for another
# thread's shared one once the calling thread has held the first shared bind,
# so a `&mut self` virtual (`frame`, or the stack Godot asks for as it prints)
# would panic while another thread's call on the language is under way; the
# godot-cell patched in below makes it wait.
godot = { version = "0.5.5", features = ["api-4-6", "experimental-threads"] }
# Links the mruby archive the beni gem builds; the gem and the crate release
# in lockstep, so their versions move together.
beni = "0.17.0"
ruby-prism = "1.9.0"

[dev-dependencies]
# The cell gdext holds objects in, for the orderings Godot's threads rely on.
godot-cell = "=0.5.5"

[patch.crates-io]
# gdext's godot-cell with its mutable bind made to wait for other threads'
# shared ones; `rake beni:build` writes it (tasks/support/godot_cell.rb).
godot-cell = { path = "../vendor/godot-cell" }
