# Pin the Rust toolchain so local builds and CI compile with the same compiler.
# Kept at the repository root because rustup resolves it from the working
# directory, and cargo is run both from here and from rust/.
[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
# The x86_64 half of the universal macOS library; the native target comes with
# the toolchain.
targets = ["x86_64-apple-darwin"]
profile = "minimal"
